name: Generate and Render Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Video Başlığı'
        required: true
      topic:
        description: 'Video Mövzusu'
        required: true

jobs:
  generate-and-render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser

      - name: Generate Story + Audio + Images
        run: |
          node cli/index.js generate \
            --title "${{ github.event.inputs.title }}" \
            --topic "${{ github.event.inputs.topic }}"
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

      - name: Render Video
        run: |
          SLUG=$(echo "${{ github.event.inputs.title }}" | \
            tr '[:upper:]' '[:lower:]' | \
            sed 's/[^a-z0-9]/-/g' | \
            sed 's/^-\|-$//g')
          npx remotion render $SLUG out/video.mp4

      - name: Delete old Release
        run: gh release delete latest --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: Latest Video
          files: out/video.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
