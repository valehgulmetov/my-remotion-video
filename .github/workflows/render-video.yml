name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Video Başlığı'
        required: true
        default: 'Default Title'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install System Dependencies for Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser

      - name: Install npm dependencies
        run: npm ci

      - name: Create Safe Props File
        run: |
          node -e '
            const fs = require("fs");
            const input = process.env.INPUT_TITLE || "Default Title";
            fs.writeFileSync("props.json", JSON.stringify({ title: input }));
          '
        env:
          INPUT_TITLE: ${{ github.event.inputs.title }}

      - name: Render Video
        run: |
          npx remotion render history-of-venus out/video.mp4 --props=props.json

      - name: Upload to Transfer.sh (Direct MP4 URL)
        run: |
          URL=$(curl --upload-file out/video.mp4 https://transfer.sh/video.mp4)
          echo "VIDEO_URL=$URL"
          echo "Direct Video URL: $URL"
