name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Video Başlığı'
        required: true
        default: 'Default Title'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Render Video
        run: |
          npx remotion render history-of-venus out/video.mp4 --props='{"title":"${{ github.event.inputs.title }}"}'

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v3
        with:
          name: rendered-video
          path: out/video.mp4
