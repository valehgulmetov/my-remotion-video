name: Render Remotion Video

on:
  workflow_dispatch:
    inputs:
      title:
        description: 'Video Başlığı'
        required: true
        default: 'Default Title'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Render Video
        run: |
          npx remotion render history-of-venus out/video.mp4 --props='{"title":"${{ github.event.inputs.title }}"}'

      - name: Upload to Transfer.sh (Direct MP4 URL)
        run: |
          URL=$(curl --upload-file out/video.mp4 https://transfer.sh/video.mp4)
          echo "VIDEO_URL=$URL" >> $GITHUB_ENV
          echo "Direct Video URL: $URL"

      - name: Trigger Make Webhook with Video URL
        run: |
          curl -X POST "SİZİN_MAKE_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{\"video_url\": \"${{ env.VIDEO_URL }}\"}"
